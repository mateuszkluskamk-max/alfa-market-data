name: Probe ALFA Cloudflare Worker
on:
  push:
    paths:
      - 'src/index.js'
      - 'wrangler.jsonc'
      - '.github/workflows/probe-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Allow Cloudflare Git deployment to catch up
        run: sleep 35
      - name: Test public endpoint and report safe connectivity diagnostics
        run: |
          set -eu
          HOST='https://alfa-market-data.mateuszkluska-mk.workers.dev'
          echo '=== Worker diagnostics (Binance / Kraken public API statuses) ==='
          curl -sS --max-time 60 "$HOST/diagnostics" -o /tmp/alfa-diagnostics.json || true
          python3 - <<'PY'
          import json
          try:
              j=json.load(open('/tmp/alfa-diagnostics.json'))
              print('Diagnostics version:',j.get('diagnostics_version'))
              print('Collector:',j.get('collector'))
              for r in j.get('checks',[]):print('Network:',r.get('name'),r.get('http_status'),r.get('api_error'))
              for r in j.get('pairValidation',[]):print('OHLC:',r.get('symbol'),r.get('interval'), 'OK' if r.get('ok') else r.get('error'))
          except Exception as exc: print('Diagnostics unreadable:',str(exc))
          PY
          echo
          echo '=== Root route / code capabilities ==='
          curl -sS --max-time 15 "$HOST/" || true
          echo
          echo '=== Latest endpoint HTTP status and data validation ==='
          CODE=$(curl -sS --max-time 50 -o /tmp/alfa-latest.json -w '%{http_code}' "$HOST/latest.json" || true)
          echo "HTTP STATUS: $CODE"
          python3 - <<'PY'
          import json,sys
          try:
              p=json.load(open('/tmp/alfa-latest.json'))
              print('snapshot_utc:',p.get('snapshot_utc'))
              print('error:',p.get('error'))
              print('symbols:', sorted(p.get('symbols',{})))
              print('market:',p.get('market'))
              expected={'BTCUSD','ETHUSD','SOLUSD'}
              market=p.get('market','')
              if not expected.issubset(p.get('symbols',{})) or p.get('error') or not (market.startswith('Bitstamp') or market.startswith('Kraken')) or p.get('schema_version',0)<4:
                  print('FAIL: Cloudflare feed not delivering valid USD market data')
                  sys.exit(1)
              from datetime import datetime,timezone
              source_time=datetime.fromisoformat(p['snapshot_utc'].replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-source_time).total_seconds()
              print('age_seconds:',round(age,2))
              if age<0 or age>300: raise RuntimeError('Data older than 5 minutes')
              for name in expected:
                  iv=p['symbols'][name]['intervals']
                  if set(iv)!={'1h','4h','1d'} or not all(iv[k]['last_closed']['closed'] for k in iv):
                      raise RuntimeError('Invalid closed candles '+name)
              print('PASS: fresh USD feed, 3 symbols, 1H/4H/1D')
          except Exception as e:
              print('Response not JSON:',type(e).__name__,str(e)[:250])
              sys.exit(1)
          PY
      - name: Verify GitHub mirror code with production Cloudflare feed
        run: python scripts/mirror_worker.py

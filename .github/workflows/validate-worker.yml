name: Validate ALFA Market Feed
on:
  push:
    paths:
      - 'src/index.js'
      - 'scripts/test-worker.mjs'
      - 'wrangler.jsonc'
      - '.github/workflows/validate-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate worker JavaScript
        run: node --check src/index.js
      - name: Exercise Worker with mocked exchange and KV
        run: node scripts/test-worker.mjs
      - name: Test ALFA two-way radar
        run: node scripts/test-radar.mjs
      - name: Validate Cloudflare configuration
        run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); if(!c.triggers.crons.includes('*/5 * * * *')) process.exit(1)"

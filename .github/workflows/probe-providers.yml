name: Verify ALFA alternate providers
on:
  push:
    paths:
      - 'src/index.js'
      - '.github/workflows/probe-providers.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Allow Cloudflare deployment
        run: sleep 35
      - name: Probe Bitstamp Coinbase API from Cloudflare
        run: |
          curl --fail-with-body -sS --max-time 75 -H 'Accept: application/json' 'https://alfa-market-data.mateuszkluska-mk.workers.dev/provider-check' -o /tmp/providers.json
          python3 - <<'PY'
          import json
          j=json.load(open('/tmp/providers.json'))
          for c in j.get('checks',[]): print(c,flush=True)
          if len(j.get('checks',[]))!=6: raise RuntimeError('Provider list incomplete')
          PY

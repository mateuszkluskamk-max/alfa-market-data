name: Probe ALFA Cloudflare Worker
on:
  push:
    paths:
      - 'src/index.js'
      - 'src/radar.js'
      - 'wrangler.jsonc'
      - '.github/workflows/probe-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Allow Cloudflare Git deployment to catch up
        run: sleep 35
      - name: Test public endpoint and report safe connectivity diagnostics
        run: |
          set -eu
          HOST='https://alfa-market-data.mateuszkluska-mk.workers.dev'
          echo '=== Worker diagnostics (Binance / Kraken public API statuses) ==='
          curl -sS --max-time 60 "$HOST/diagnostics" -o /tmp/alfa-diagnostics.json || true
          python3 - <<'PY'
          import json
          try:
              j=json.load(open('/tmp/alfa-diagnostics.json'))
              print('Diagnostics version:',j.get('diagnostics_version'))
              print('Collector:',j.get('collector'))
              for r in j.get('checks',[]):print('Network:',r.get('name'),r.get('http_status'),r.get('api_error'))
              for r in j.get('pairValidation',[]):print('OHLC:',r.get('symbol'),r.get('interval'), 'OK' if r.get('ok') else r.get('error'))
          except Exception as exc: print('Diagnostics unreadable:',str(exc))
          PY
          echo
          echo '=== Root route / code capabilities ==='
          curl -sS --max-time 15 "$HOST/" || true
          echo
          echo '=== Latest endpoint HTTP status and data validation ==='
          CODE=$(curl -sS --max-time 50 -o /tmp/alfa-latest.json -w '%{http_code}' "$HOST/latest.json" || true)
          echo "HTTP STATUS: $CODE"
          python3 - <<'PY'
          import json,sys
          try:
              p=json.load(open('/tmp/alfa-latest.json'))
              print('snapshot_utc:',p.get('snapshot_utc'))
              print('error:',p.get('error'))
              print('symbols:', sorted(p.get('symbols',{})))
              print('market:',p.get('market'))
              expected={'BTCUSD','ETHUSD','SOLUSD'}
              market=p.get('market','')
              if not expected.issubset(p.get('symbols',{})) or p.get('error') or not (market.startswith('Bitstamp') or market.startswith('Kraken')) or p.get('schema_version',0)<4:
                  print('FAIL: Cloudflare feed not delivering valid USD market data')
                  sys.exit(1)
              from datetime import datetime,timezone
              source_time=datetime.fromisoformat(p['snapshot_utc'].replace('Z','+00:00'))
              age=(datetime.now(timezone.utc)-source_time).total_seconds()
              print('age_seconds:',round(age,2))
              if age<0 or age>300: raise RuntimeError('Data older than 5 minutes')
              for name in expected:
                  iv=p['symbols'][name]['intervals']
                  if set(iv)!={'1h','4h','1d'} or not all(iv[k]['last_closed']['closed'] for k in iv):
                      raise RuntimeError('Invalid closed candles '+name)
              print('PASS: fresh USD feed, 3 symbols, 1H/4H/1D')
          except Exception as e:
              print('Response not JSON:',type(e).__name__,str(e)[:250])
              sys.exit(1)
          PY
      - name: Verify Cloudflare KV binding and archive status
        run: |
          set -eu
          HOST='https://alfa-market-data.mateuszkluska-mk.workers.dev'
          curl --fail-with-body -sS --max-time 25 "$HOST/health" -o /tmp/alfa-health.json
          curl --fail-with-body -sS --max-time 25 "$HOST/history.json?limit=12" -o /tmp/alfa-history.json
          python3 - <<'PY'
          import json,sys
          h=json.load(open("/tmp/alfa-health.json"))
          a=json.load(open("/tmp/alfa-history.json"))
          print("KV bound:",h.get("kv_configured"))
          print("KV latest:",h.get("snapshot_utc"),"seconds:",h.get("age_seconds"))
          print("KV archive:",a.get("date"),"entries:",a.get("count"),"latest_keys:",a.get("keys",[])[-3:] )
          if h.get("kv_configured") is not True: sys.exit("KV binding not provisioned")
          if a.get("error") or "keys" not in a: sys.exit("KV archive endpoint not working")
          PY
      - name: Verify GitHub mirror code with production Cloudflare feed
        run: python scripts/mirror_worker.py
      - name: Inspect Cloudflare dispatch status (public, no secrets)
        run: |
          curl --fail-with-body -sS --max-time 20 'https://alfa-market-data.mateuszkluska-mk.workers.dev/bridge-status.json' -o /tmp/bridge-status.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/bridge-status.json'))
          print('Bridge:', {k:v.get(k) for k in ('status','checked_utc','snapshot_utc','http_status','detail') if k in v})
          PY
      - name: Validate two-direction ALFA radar v1
        run: |
          curl --fail-with-body -sS --max-time 45 'https://alfa-market-data.mateuszkluska-mk.workers.dev/radar.json' -o /tmp/alfa-radar.json
          python3 - <<'PY'
          import json,datetime
          d=json.load(open('/tmp/alfa-radar.json'))
          assert d.get('schema_version',0)>=5, 'Radar schema is not deployed'
          assert d.get('radar_version')=='directional-v1', 'Wrong radar version'
          assert set(d.get('assets',{}))=={'BTCUSD','ETHUSD','SOLUSD'},'Missing market'
          for symbol, a in d['assets'].items():
              radar=a.get('radar',{})
              assert radar.get('version')=='directional-v1'
              print(symbol,'price_usd=',a['last_price_usd'],'status=',radar.get('status'),'metrics=',radar.get('metrics'),flush=True)
          for sig in d.get('signals',[]):
              assert sig.get('direction') in ('UP','DOWN')
              assert sig.get('severity') in ('WATCH','ALERT')
              assert sig.get('event_id') and 'BUY' not in sig.get('kind','')
              print('SIGNAL',sig['event_id'],sig['severity'],'confirmed=',sig['confirmed'],flush=True)
          age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(d['snapshot_utc'].replace('Z','+00:00'))).total_seconds()
          assert -10<=age<=600,f'Radar stale: {age}'
          print('PASS: live bidirectional ALFA radar, age_seconds=',round(age,1),'signals=',len(d.get('signals',[])),flush=True)
          PY

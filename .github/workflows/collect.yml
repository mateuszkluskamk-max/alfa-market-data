name: ALFA Market Data Snapshot
on:
  workflow_dispatch:
    inputs:
      cloudflare_mirror_only:
        description: "Sync the Cloudflare USD snapshot without re-collecting Binance"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [alfa_cloudflare_sync]
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
permissions:
  contents: write
concurrency:
  group: alfa-market-data
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate Binance public candles
        if: github.event_name != 'repository_dispatch' && github.event.inputs.cloudflare_mirror_only != 'true'
        run: python scripts/collect.py
      - name: Mirror Cloudflare market feed (best effort, no stale overwrite)
        run: |
          python scripts/mirror_worker.py || echo "Cloudflare mirror unavailable; original Binance snapshot remains intact"
      - name: Publish validated data
        run: |
          git config user.name "alfa-data-bot"
          git config user.email "alfa-data-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[skip ci] data: refresh market snapshot"
            if ! git push; then
              echo "Another workflow committed during snapshot; rebasing safely"
              git fetch origin main
              if git rebase origin/main; then
                git push
              else
                git rebase --abort
                echo "::error::Concurrent update to the same data file; leaving remote intact, next run will refresh"
                exit 1
              fi
            fi
          fi
